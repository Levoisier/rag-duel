[project]
name = "ragduel-python"
version = "0.1.0"
description = "RAG Duel — Python (FastAPI) RAG engine, the right column of the duel."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
# uv's native dev group — installed by `uv sync`, excluded from the published app.
dev = [
    "pytest>=8.3",
    "httpx>=0.28",      # FastAPI's TestClient transport
    "ruff>=0.8",        # lint + format (TEST-04)
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
