[project]
name = "ragduel-python"
version = "0.1.0"
description = "RAG Duel — Python (FastAPI) RAG engine, the right column of the duel."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary]>=3.2",   # Postgres driver (async) for the shared DB
    "httpx>=0.28",            # async HTTP for the Gemini/Groq provider layer (CONTRACT-05)
]

[dependency-groups]
# uv's native dev group — installed by `uv sync`, excluded from the published app.
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",   # async provider/fallback tests (CONTRACT-05)
    "ruff>=0.8",              # lint + format (TEST-04)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
